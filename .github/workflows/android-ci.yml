name: android-ci

on:
  push:
    branches: [ "master", "main", "feature/**" ]
  pull_request:
  # 支持在 Actions 页面手动运行（只想拿一个 debug 包时不用非要推代码）
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 与本机一致：构建 JDK 21（见 gradle.properties 的 org.gradle.java.home 说明）
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # CI 上的两处准备：
      # 1) 没有本机固定路径的 JDK：清掉 org.gradle.java.home，让 Gradle 用 JAVA_HOME；
      #    注意：这之后守护进程 JDK 由 gradle/gradle-daemon-jvm.properties 决定，该文件
      #    （updateDaemonJvm 生成，钉 toolchainVersion=25 + foojay 下载地址）必须不存在，
      #    否则 Gradle 9 会去下载一整个 JDK——国内构建机上直接失败（见 docs/p0/README.md D-4）。
      #    仓库里已删除，这里再兜底删一次；
      # 2) gradlew 在仓库里是 100644（Windows 提交的，没有可执行位），Linux runner 上
      #    直接 ./gradlew 会 Permission denied。永久修法是 `git update-index --chmod=+x gradlew`
      #    并提交；这里再补一句 chmod 兜底。
      - name: Prepare for CI
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties
          rm -f gradle/gradle-daemon-jvm.properties
          chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      # 即使测试/lint 挂了也把 APK 编出来（任务本身仍然是红的，不影响 CI 门禁语义），
      # 免得"只想拿一个包"时被 lint 的告警卡住
      - name: Assemble debug APK
        if: always()
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      # debug 包单独放一个 artifact，下载下来就是 apk，不用在 reports 里翻
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmcomic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
