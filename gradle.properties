# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# P0 固定构建 JDK：本机 JDK 21（与本工程 Java/Kotlin target 一致）。
# 不要删掉这一行：P0 构建曾因为 Gradle 去找 JDK 25 工具链而卡在下载一整个 JDK。
org.gradle.java.home=D\:\\Environment\\jdk-21.0.4

# 禁止 Gradle 自动下载 JDK 工具链。Gradle 9 内置了工具链自动配置（默认走 api.foojay.io，
# 再跳到 github.com/adoptium），一旦有地方请求了本机没有的 JDK，它就会去拉一整个 JDK；
# 国内构建机（Gitee Go）拉不动，报 "Unable to download toolchain matching the requirements"
# 直接失败。本工程不需要任何工具链：Java/Kotlin target 21 全部由守护进程自身的 JDK 21 编译。
# 相关：updateDaemonJvm 生成的 gradle/gradle-daemon-jvm.properties 已被删除，**不要再生成
# 或提交它**——它会把守护进程 JDK 钉在某个版本（历史值 25）并在 CI 上触发上面的下载。
org.gradle.java.installations.auto-download=false

android.builder.sdkDownload=false

# 配置缓存可以跳过配置阶段；若报缓存不兼容，先跑一次 --no-configuration-cache 定位。
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Kotlin
kotlin.code.style=official

# AndroidX
android.useAndroidX=true

# 只为本工程生成 R 类，加快构建
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
